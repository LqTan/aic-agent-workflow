name: aic-production

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aic}:${POSTGRES_PASSWORD:-aic}@db:5432/${POSTGRES_DB:-aic}
  # Inside the container the AIC dataset is mounted at /data.
  KIS_DATA_ROOT: /data
  KIS_INDEX_ROOT: /data/search_index
  KIS_DOMAIN_TAXONOMY: /data/search_index/taxonomy.json
  # Real search by default — flip to `true` to bypass torch + open_clip_torch.
  KIS_DEMO_MODE: ${KIS_DEMO_MODE:-false}
  KIS_CLIP_MODEL: ViT-B-32
  KIS_CLIP_PRETRAINED: openai
  KIS_EMBEDDING_PROVIDER: ${KIS_EMBEDDING_PROVIDER:-remote}
  KIS_EMBEDDING_URL: ${KIS_EMBEDDING_URL:-}
  KIS_EMBEDDING_API_KEY: ${KIS_EMBEDDING_API_KEY:-}
  KIS_LLM_API_KEY: ${KIS_LLM_API_KEY:-}
  KIS_LLM_ENDPOINT: ${KIS_LLM_ENDPOINT:-}
  KIS_LLM_MODEL: ${KIS_LLM_MODEL:-}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://103.200.22.67:3001}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aic}
      POSTGRES_USER: ${POSTGRES_USER:-aic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/lqtan/aic-backend:latest
    pull_policy: always
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Bind mounts from the host so the host's data/ folder (manifest, clip
    # features, keyframes, objects, videos) becomes /data inside the
    # container. The repo's data/search_index/ directory is created by
    # `prepare-data` + `build-index` and re-used across runs.
    volumes:
      - ../../data:/data
      - ../../data/search_index:/data/search_index
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: ghcr.io/lqtan/aic-frontend:latest
    pull_policy: always
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.113.3
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../n8n:/workflows:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
