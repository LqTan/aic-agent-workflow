name: aic-production

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aic}:${POSTGRES_PASSWORD:-aic}@db:5432/${POSTGRES_DB:-aic}
  KIS_DATA_ROOT: /data/aic
  KIS_INDEX_ROOT: /data/search_index
  KIS_DEMO_MODE: ${KIS_DEMO_MODE:-true}
  KIS_CLIP_MODEL: ViT-B-32
  KIS_CLIP_PRETRAINED: openai
  KIS_LLM_API_KEY: ${KIS_LLM_API_KEY:-}
  KIS_LLM_ENDPOINT: ${KIS_LLM_ENDPOINT:-}
  KIS_LLM_MODEL: ${KIS_LLM_MODEL:-}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aic}
      POSTGRES_USER: ${POSTGRES_USER:-aic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_index:/data/search_index
      - backend_data:/data/aic
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.113.3
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../n8n:/workflows:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  backend_index:
  backend_data:
  n8n_data:
