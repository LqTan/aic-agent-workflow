[project]
name = "clip-inference"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "onnxruntime",
    "numpy",
    "transformers",
    "onnxscript>=0.7.2",
]

[project.optional-dependencies]
export = [
    "torch",
    "open-clip-torch",
    "onnx"
]
build = [
    "pyinstaller>=6.0.0"
]
