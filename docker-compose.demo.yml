services:
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile.demo
    environment:
      KIS_SEARCH_FUNCTION: search_engine.demo.search
      KIS_INSPECT_FUNCTION: search_engine.demo.inspect
      KIS_LLM_API_KEY: ${KIS_LLM_API_KEY:-}
      KIS_LLM_ENDPOINT: ${KIS_LLM_ENDPOINT:-}
      KIS_LLM_MODEL: ${KIS_LLM_MODEL:-}

  n8n:
    image: n8nio/n8n:1.113.3
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_data:
