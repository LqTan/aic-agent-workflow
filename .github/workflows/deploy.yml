name: Deploy AIC to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: lqtan

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aic-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=main

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 103.200.22.67
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /services/aic

            echo "=== pull latest repo ==="
            git fetch --all
            git reset --hard origin/main

            echo "=== ensure data dir ==="
            mkdir -p data/search_index

            echo "=== pull images ==="
            docker compose -f docker/production/docker-compose.yml \
              -p aic-production pull

            echo "=== restart services ==="
            docker compose -f docker/production/docker-compose.yml \
              -p aic-production up -d --remove-orphans --build backend frontend

            echo "=== health check (best-effort) ==="
            sleep 10
            docker compose -f docker/production/docker-compose.yml \
              -p aic-production ps

            echo "=== cleanup ==="
            docker image prune -f

            echo "=== done ==="
