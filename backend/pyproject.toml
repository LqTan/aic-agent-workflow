[project]
name = "aic-backend"
version = "0.1.0"
description = "AIC Agentic Video Retrieval backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "python-multipart>=0.0.20",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "rtree>=1.3.0",
    "httpx>=0.27.0",
    "Pillow>=11.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
hybrid = [
    "open-clip-torch>=2.29.0",
    "torch>=2.5.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Cookie",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
